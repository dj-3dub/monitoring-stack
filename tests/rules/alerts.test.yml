# Unit tests for the alert rules. Run with: make test-rules
rule_files:
  - ../../config/prometheus/rules/recording.rules.yml
  - ../../config/prometheus/rules/alerts.rules.yml

evaluation_interval: 1m

tests:
  - name: availability
    interval: 1m
    external_labels:
      host: testhost
    input_series:
      - series: 'up{job="node-exporter", instance="localhost"}'
        values: '1 0x10'
      - series: 'up{job="node-exporter", instance="192.168.1.10:9100"}'
        values: '1x10'
      - series: 'up{job="cadvisor", instance="cadvisor:8080"}'
        values: '0x10'
      - series: 'probe_success{job="blackbox_http", instance="http://grafana:3000/api/health", module="http_2xx"}'
        values: '0x10'
    alert_rule_test:
      # Down for 1 minute: still pending, nothing sent yet.
      - eval_time: 2m
        alertname: HostDown
        exp_alerts: []
      - eval_time: 4m
        alertname: HostDown
        exp_alerts:
          - exp_labels:
              alertname: HostDown
              severity: critical
              job: node-exporter
              instance: localhost
            exp_annotations:
              summary: "Host localhost is down"
              description: "node-exporter on localhost has been unreachable from testhost for 2 minutes."
      - eval_time: 4m
        alertname: MonitoringComponentDown
        exp_alerts:
          - exp_labels:
              alertname: MonitoringComponentDown
              severity: warning
              job: cadvisor
              instance: cadvisor:8080
            exp_annotations:
              summary: "cadvisor is down on testhost"
              description: "Prometheus has not been able to scrape cadvisor (cadvisor:8080) for 2 minutes."
      - eval_time: 4m
        alertname: BlackboxProbeFailing
        exp_alerts:
          - exp_labels:
              alertname: BlackboxProbeFailing
              severity: critical
              job: blackbox_http
              instance: http://grafana:3000/api/health
              module: http_2xx
            exp_annotations:
              summary: "Health check failing: http://grafana:3000/api/health"
              description: "The http_2xx probe to http://grafana:3000/api/health has failed for 2 minutes."

  - name: cpu and memory
    interval: 1m
    input_series:
      # 6 idle seconds per 60s = 90% busy.
      - series: 'node_cpu_seconds_total{instance="localhost", job="node-exporter", cpu="0", mode="idle"}'
        values: '0+6x30'
      - series: 'node_memory_MemTotal_bytes{instance="localhost", job="node-exporter"}'
        values: '1000x30'
      # 50 of 1000 bytes available = 95% used.
      - series: 'node_memory_MemAvailable_bytes{instance="localhost", job="node-exporter"}'
        values: '50x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: HighCPU
        exp_alerts: []
      - eval_time: 20m
        alertname: HighCPU
        exp_alerts:
          - exp_labels:
              alertname: HighCPU
              severity: warning
              instance: localhost
            exp_annotations:
              summary: "High CPU on localhost"
              description: "CPU usage has been above 85% for 10 minutes (now 90%)."
      - eval_time: 20m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              alertname: HighMemory
              severity: warning
              instance: localhost
              job: node-exporter
            exp_annotations:
              summary: "High memory on localhost"
              description: "Memory usage has been above 90% for 10 minutes (now 95%)."

  - name: disk thresholds
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="localhost", job="node-exporter", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '1000x30'
      # 100 of 1000 available = 90% used: DiskFillingUp but not DiskAlmostFull.
      - series: 'node_filesystem_avail_bytes{instance="localhost", job="node-exporter", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '100x30'
      # tmpfs is ignored even when full.
      - series: 'node_filesystem_size_bytes{instance="localhost", job="node-exporter", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{instance="localhost", job="node-exporter", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: DiskFillingUp
        exp_alerts:
          - exp_labels:
              alertname: DiskFillingUp
              severity: warning
              instance: localhost
              job: node-exporter
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Disk / on localhost is 90% full"
              description: "Filesystem / has been above 85% for 10 minutes."
      - eval_time: 15m
        alertname: DiskAlmostFull
        exp_alerts: []

  - name: disk trend
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="localhost", job="node-exporter", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '10000x200'
      # Starts 60% used and loses 5 bytes a minute: full well within 24 hours.
      - series: 'node_filesystem_avail_bytes{instance="localhost", job="node-exporter", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '4000-5x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: DiskWillFillIn24h
        exp_alerts: []
      - eval_time: 120m
        alertname: DiskWillFillIn24h
        exp_alerts:
          - exp_labels:
              alertname: DiskWillFillIn24h
              severity: warning
              instance: localhost
              job: node-exporter
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Disk / on localhost will fill within 24 hours"
              description: "At the current rate of growth, / runs out of space within a day."
