groups:
  - name: node_recording_rules
    interval: 1m
    rules:
      - record: instance:node_cpu_utilization:percent
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))

      - record: instance:node_memory_utilization:percent
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))

      # Per filesystem, based on space available to normal users (what `df` shows).
      - record: instance:node_filesystem_usage:percent
        expr: >
          100 * (1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|ramfs|overlay|squashfs|nsfs|tracefs|fuse.lxcfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|ramfs|overlay|squashfs|nsfs|tracefs|fuse.lxcfs"}
          ))

      - record: instance:node_disk_io_time_seconds:rate5m
        expr: sum by (instance, device) (rate(node_disk_io_time_seconds_total[5m]))
